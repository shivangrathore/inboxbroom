<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gmail Inbox Cleaner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand"><span id="dot" class="dot"></span><h1>Inbox Cleaner</h1></div>
    <button id="openOptions" class="icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <div id="status" class="status">
    <div class="bar"><div class="fill"></div></div>
    <p id="statusText">Ready.</p>
  </div>

  <section class="rules" id="rules"></section>

  <div class="actions">
    <button id="scan" class="btn primary">Preview</button>
    <button id="review" class="btn ghost hidden">Open review</button>
    <button id="clean" class="btn ghost" title="Skip the review and run all rules now">Clean now</button>
    <button id="stop" class="btn danger hidden">Stop</button>
  </div>

  <section id="results" class="results"></section>

  <footer>
    <button id="historyBtn" class="link">Recent runs</button>
    <span id="historyText" class="muted"></span>
  </footer>
  <ul id="historyList" class="history hidden"></ul>

  <script src="popup.js"></script>
</body>
</html>
