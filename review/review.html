<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inbox Broom – Review</title>
  <script src="../lib/compat.js"></script>
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="../ui/theme.css" />
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon-48.png" width="24" height="24" alt="" /><div><h1>Review before cleaning</h1><div id="meta" class="small muted"></div></div></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search sender, subject, reason…" />
      <select id="groupBy"><option value="">No grouping</option><option value="sender">Group by sender</option><option value="label">Group by label</option></select>
    </div>
  </header>

  <div class="filters">
    <div id="summary" class="chips"></div>
    <div id="ruleChips" class="chips"></div>
    <div id="labelChips" class="chips"></div>
  </div>

  <div class="layout">
    <main id="main"></main>
    <aside id="detail" class="detail card hidden"></aside>
  </div>

  <footer class="bar">
    <div class="left"><div id="progress" class="small"></div><div class="small muted">Untick to leave alone · click a verdict to flip · nothing happens until Confirm · Trash keeps 30 days</div></div>
    <div class="right"><button id="rescan" class="btn">Preview again</button><button id="confirm" class="btn danger">Confirm</button></div>
  </footer>
  <div id="toast" class="toast"></div>
  <script src="review.js"></script>
</body>
</html>
