name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gmail-inbox-cleaner-xpi
          path: web-ext-artifacts/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gmail-inbox-cleaner-xpi
          path: dist
      - name: Rename to .xpi
        run: for f in dist/*.zip; do mv "$f" "${f%.zip}.xpi"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xpi
          body: |
            Unsigned build. Install in Firefox Developer Edition / Nightly / ESR with
            `xpinstall.signatures.required = false`, or load temporarily via about:debugging.
            See README for signing with your own AMO key.
