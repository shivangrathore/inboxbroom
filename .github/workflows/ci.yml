name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: inboxbroom-packages
          path: |
            dist/inboxbroom-firefox.xpi
            dist/inboxbroom-chrome.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inboxbroom-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/inboxbroom-firefox.xpi
            dist/inboxbroom-chrome.zip
          body: |
            **Firefox**: `inboxbroom-firefox.xpi` (unsigned: Developer Edition / Nightly / ESR with
            `xpinstall.signatures.required = false`, or load temporarily via about:debugging).
            **Chrome / Edge / Brave**: unzip `inboxbroom-chrome.zip`, then chrome://extensions → Developer mode → Load unpacked.
